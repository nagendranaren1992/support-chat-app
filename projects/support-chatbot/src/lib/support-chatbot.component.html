<div class="chatbot-wrapper">
  <!-- Support Button -->
  <button *ngIf="!isVisible" (click)="openChat()" class="support-button" type="button" title="Open Support Chat">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Support Chat Icon - Chat bubble with question mark -->
      <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H6L4 18V4H20V16Z"
        fill="currentColor" />
      <path
        d="M12 6C10.34 6 9 7.34 9 9C9 9.55 9.45 10 10 10C10.55 10 11 9.55 11 9C11 8.45 11.45 8 12 8C12.55 8 13 8.45 13 9C13 9.55 12.55 10 12 10V11C12.55 11 13 11.45 13 12C13 12.55 12.55 13 12 13C11.45 13 11 12.55 11 12H9C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.9 14.1 10 13 10V9C14.1 9 15 8.1 15 7C15 5.34 13.66 4 12 4Z"
        fill="white" />
      <circle cx="12" cy="16.5" r="1" fill="white" />
    </svg>
  </button>

  <!-- Chatbot Container -->
  <div class="chatbot-container" [class.minimized]="isMinimized" [class.hidden]="!isVisible">
    <div class="chatbot-header">
      <div class="header-content">
        <div class="bot-avatar">
          <img [src]="botAvatar" alt="Bot Avatar" width="25" height="25" />
        </div>
        <div class="header-text">
          <h3>{{ botName }}</h3>
          <span class="status-indicator">Online</span>
        </div>
      </div>
      <div class="header-actions">
        <button (click)="minimizeChat()" class="icon-btn minimize-btn" title="Minimize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 14H4V10H20V14Z" fill="currentColor" />
          </svg>
        </button>
        <button (click)="closeChat()" class="icon-btn close-btn" title="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
              fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>

    <div class="messages" #scrollContainer *ngIf="!isMinimized">
      <div *ngFor="let msg of messages; let i = index" [class.user]="msg.from === 'user'"
        [class.bot]="msg.from === 'bot'" class="message-bubble">
        <ng-container *ngIf="msg.videoUrl">
          <div class="video-preview-container">
            <video [src]="msg.videoUrl" controls></video>
            <div class="video-actions" *ngIf="msg.isPendingUpload">
              <button (click)="sendVideo(i)" class="icon-btn send-btn" title="Send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor" />
                </svg>
              </button>
              <button (click)="cancelVideo(i)" class="icon-btn cancel-btn" title="Cancel">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
                    fill="currentColor" />
                </svg>
              </button>
            </div>
            <div *ngIf="!msg.isPendingUpload" class="video-status">
              {{ msg.text }}
            </div>
          </div>
        </ng-container>
        <div *ngIf="!msg.videoUrl" class="message-text">
          {{ msg.text }}
        </div>
        <span class="message-time">{{ getCurrentTime() }}</span>
      </div>
    </div>

    <div class="input-area" *ngIf="!isMinimized">
      <div class="input-wrapper">
        <input [(ngModel)]="userInput" placeholder="Type your message..." (keyup.enter)="sendMessage()"
          class="message-input" />
        <div class="action-buttons">
          <label for="file-input" class="icon-btn file-btn" title="Upload Image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M21 19V5C21 3.9 20.1 3 19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19ZM8.5 13.5L11 16.51L14.5 12L19 18H5L8.5 13.5Z"
                fill="currentColor" />
            </svg>
            <input id="file-input" type="file" accept="image/*" (change)="onScreenshotSelected($event)"
              style="display: none;" />
          </label>

          <button (click)="startVideoRecording()" [disabled]="isRecording" class="icon-btn record-btn"
            [class.recording]="isRecording" [title]="isRecording ? 'Recording...' : 'Record Screen'">
            <svg *ngIf="!isRecording" width="20" height="20" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M17 10.5V7C17 6.45 16.55 6 16 6H4C3.45 6 3 6.45 3 7V17C3 17.55 3.45 18 4 18H16C16.55 18 17 17.55 17 17V13.5L21 17.5V6.5L17 10.5Z"
                fill="currentColor" />
            </svg>
            <svg *ngIf="isRecording" width="20" height="20" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M17 10.5V7C17 6.45 16.55 6 16 6H4C3.45 6 3 6.45 3 7V17C3 17.55 3.45 18 4 18H16C16.55 18 17 17.55 17 17V13.5L21 17.5V6.5L17 10.5Z"
                fill="currentColor" />
              <circle cx="12" cy="12" r="3" fill="white" />
            </svg>
          </button>

          <button *ngIf="isRecording" (click)="stopVideoRecording()" class="icon-btn stop-btn" title="Stop Recording">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
            </svg>
          </button>

          <button (click)="sendMessage()" class="icon-btn send-btn" title="Send Message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
